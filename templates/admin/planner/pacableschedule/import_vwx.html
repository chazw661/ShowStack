{% extends "admin/base_site.html" %}

{% block content %}

<div style="background: #1e1e1e; color: #eee; padding: 18px; margin: 20px 0; border-left: 4px solid #417690; border-radius: 4px;">
    <p style="margin-top: 0;">Upload the cable worksheet exported from Vectorworks. You will see every row before anything is saved.</p>
    <p style="margin-bottom: 0;">Columns: <code>Cable Label</code>, <code>Destination</code>, <code>Connector</code>, <code>Fan-Out</code>, <code>Length (ft)</code>, and optionally <code>Extension Of</code>.</p>
</div>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <div style="margin: 20px 0;">
        <label for="csv_file" style="display: block; margin-bottom: 6px; font-weight: bold;">Select CSV file:</label>
        <input type="file" name="csv_file" id="csv_file" accept=".csv,text/csv" required>
    </div>
    <div style="margin: 20px 0;">
        <input type="submit" value="Preview import" class="default"
               style="padding: 10px 22px; background: #417690; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600;">
        <a href="{% url 'admin:planner_pacableschedule_changelist' %}" style="margin-left: 12px;">Cancel</a>
    </div>
</form>
{% endblock %}
