{% extends "admin/change_list.html" %}
{% load i18n admin_urls static %}

{% block object-tools-items %}

    <li><a href="{% url 'admin:planner_device_add' %}{% if is_popup %}?_popup=1{% endif %}" class="addlink">Add I/O device</a></li>
    <li><a href="{% url 'admin:planner_device_add' %}?kind=comm" class="addlink" id="add-comm-device">Add comm device</a></li>
    {% endif %}
    <li>
        <a href="{% url 'planner:all_devices_pdf_export' %}" 
           class="button" 
           style="background-color: #4a9eff; color: white; padding: 8px 15px; text-decoration: none; border-radius: 3px;">
            Export All Devices PDF
        </a>
    </li>
{% endblock %}
