{% comment %}
PR 2b-2: an amp input's link state, inside its cell. ``linked`` is the
source's datalist entry when the input is linked, else blank. An editor's
button offers "Unlink (keep text)"; a viewer's is a plain marker.
{% endcomment %}
{% if can_edit %}<button type="button"{% else %}<span{% endif %} class="amp-link-btn{% if linked %} linked{% endif %}"
    data-channel-id="{{ channel_id }}" data-field="{{ field }}"
    title="{% if linked %}Linked to {{ linked }}{% else %}Not linked. Pick an entry from the list to link it.{% endif %}"
    aria-label="{% if linked %}Linked to {{ linked }}{% else %}Not linked{% endif %}"><svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M6.5 9.5l3-3M5 7.5L3.5 9a2.1 2.1 0 003 3L8 10.5M8 5.5L9.5 4a2.1 2.1 0 013 3L11 8.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>{% if can_edit %}</button>{% else %}</span>{% endif %}
