{% load tutorial_tags %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>{% block title %}Help{% endblock %} — ShowStack</title>
<style>
:root {
    --bg: #0f1218;
    --surface: #171b23;
    --raised: #1f2430;
    --border: #2c3240;
    --text: #e6e8ec;
    --muted: #a0a6b2;
    --accent: #4a9eff;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
a { color: var(--accent); }
.wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 48px; }
.top {
    position: sticky; top: 0; z-index: 2;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 12px 0;
}
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-weight: 700; font-size: 18px; color: var(--text); text-decoration: none; }
.brand span { color: var(--accent); }
.close-btn {
    background: var(--raised); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 14px; font-size: 15px; cursor: pointer;
    text-decoration: none; min-height: 40px; display: inline-flex; align-items: center;
}
.search {
    margin-top: 10px; width: 100%;
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 14px; font-size: 16px; /* 16px stops iOS zooming on focus */
}
.search:focus { outline: 2px solid var(--accent); outline-offset: 0; }
h1 { font-size: 24px; margin: 24px 0 4px; }
h2 {
    font-size: 13px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); margin: 28px 0 8px;
}
.intro { color: var(--muted); margin: 0 0 8px; }
.topic {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; margin: 0 0 8px;
}
.topic > summary {
    list-style: none; cursor: pointer; padding: 14px 16px; min-height: 48px;
}
.topic > summary::-webkit-details-marker { display: none; }
.topic > summary::before { content: "▸"; color: var(--muted); margin-right: 10px; }
.topic[open] > summary::before { content: "▾"; }
.topic-title { font-weight: 600; }
.topic-summary { display: block; color: var(--muted); font-size: 14px; margin-left: 22px; }
.topic-body { padding: 0 16px 14px 38px; }
.here .topic { border-color: var(--accent); }
.body h3 { font-size: 15px; margin: 16px 0 6px; color: var(--text); }
.body ol, .body ul { padding-left: 22px; margin: 6px 0; }
.body li { margin: 4px 0; }
.body em { font-style: normal; font-weight: 600; color: #fff; }
.body .help-lede { margin-top: 4px; }
.permalink { font-size: 14px; }
.empty { color: var(--muted); display: none; }
.related { padding-left: 20px; }
.related li { margin: 6px 0; }
@media (max-width: 600px) {
    .topic-body { padding-left: 16px; }
    .topic-summary { margin-left: 22px; }
}
</style>
{% tutorial_assets %}
</head>
<body>
<div class="wrap">
{% block content %}{% endblock %}
</div>
<script>
// Help opens in its own tab on desktop/iPad; there, "Close" closes it. On a
// phone it is a normal page, and "Back" goes back.
(function () {
    var btn = document.getElementById('help-close');
    if (!btn) return;
    if (window.opener || history.length <= 1) {
        btn.textContent = 'Close';
        btn.addEventListener('click', function (e) { e.preventDefault(); window.close(); });
    } else {
        btn.addEventListener('click', function (e) { e.preventDefault(); history.back(); });
    }
})();
</script>
{% block scripts %}{% endblock %}
</body>
</html>
