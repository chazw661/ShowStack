{% if video %}<button type="button" class="ss-tutorial-btn{% if quiet %} ss-tutorial-link{% endif %}" data-tutorial="{{ video.key }}" data-tutorial-src="{{ video.embed_url }}" data-tutorial-title="{{ video.title }}" aria-haspopup="dialog">▶ {{ video.title }}{% if video.minutes %} ({{ video.minutes }} min){% endif %}</button>{% endif %}
